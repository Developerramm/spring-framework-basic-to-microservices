<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css tutorial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .one {
            background-color: steelblue;
            width: 50px;
            height: 50px;
            padding: 5px;
            margin: 5px;
        }

        #one {
            border: 2px solid red;
            border-radius: 20px 10px 3px 50px;
            box-sizing: border-box;
        }

        #two{
            border: 3px dashed aqua;
            border-radius: 30%; 
            box-sizing: border-box;
        }


    </style>
</head>

<body>
    <p>padding property</p>
    <div id="one" class="one">
        padding checker
    </div>
    <div id="two" class="one">
        second
    </div>
</body>

</html>
