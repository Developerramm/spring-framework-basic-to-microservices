<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css tutorial </title>
    <script src="https://kit.fontawesome.com/46111b4c9b.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        #nav h1 {
            text-align: center;
            background-color: powderblue;
            text-transform: capitalize;
        }

        #inner {
            font-size: 10px;
        }

        #outer {
            font-size: 25px;
        }
    </style>
</head>

<body>
    <div id="nav">
        <h1>Navigation center</h1>
    </div>

    <div id="outer">
        outer
        <div id="inner">
            inner
        </div>
    </div>

    <i style="color: red;font-size: 48px;" class="fa-solid fa-circle-user"></i>
    <i class="fa-brands fa-facebook"></i>
    <i class="fa-solid fa-lock"></i>
</body>

</html>
