<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 150px;
            height: 50px;
            border: 1px solid black;
            margin-right: 5px;
            margin: 5px;
        }

        h1 {
            /* margin-left: 50px; */
            text-align: center;
        }

        #container {
            border: 1px solid black;
            /* width: 500px; */
            height: 400px;
            padding: 10px;
            margin: 20px;

            background-color: lavender;

            display: flex;
            flex-direction: column-reverse;
            flex-direction: column;
            flex-direction: row;

            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;

            justify-content: flex-start;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            align-content: center;
        }

        #box1 {
            background-color: aqua;
        }

        #box2 {
            background-color: blueviolet;
        }

        #box3 {
            background-color: yellow;
        }

        #box4 {
            background-color: tomato;
        }
    </style>
</head>

<body>
    <h1>Flex container </h1>
    <div id="container">
        <div class="box" id="box1">Flex item 1</div>
        <div class="box" id="box2">Flex item 2</div>
        <div class="box" id="box3">flex item 3</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
        <div class="box" id="box4">flex item 4</div>
    </div>
</body>

</html>
